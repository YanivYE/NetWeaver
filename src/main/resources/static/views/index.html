<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetWeaver – Configuration</title>
    <link rel="icon" href="/images/favicon.ico" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../stylesheets/styles.css" />
  </head>
  <body>
    <!-- Top Corner Buttons -->
    <div class="top-buttons">
      <button
        type="button"
        class="btn btn-theme btn-icon"
        id="themeToggle"
        title="Toggle Theme"
      >
        <i class="bi bi-moon-fill" id="themeIcon"></i>
      </button>
      <button
        type="button"
        class="btn btn-clear btn-icon"
        id="clearForm"
        title="Clear Form"
      >
        <i class="bi bi-trash3-fill"></i>
      </button>
    </div>

    <div class="container mt-5 shadow-lg p-4 rounded">
      <h1 class="mb-4 text-center">Crawler Configuration</h1>

      <form id="crawlerForm">
        <!-- Shared Configuration Fields -->
        <div class="mb-3">
          <label for="startUrl" class="form-label">Start URL</label>
          <input
            type="url"
            class="form-control"
            id="startUrl"
            name="start_url"
            placeholder="https://example.com"
            required
          />
        </div>

        <div class="mb-3">
          <label for="depth" class="form-label">Max Depth</label>
          <input
            type="number"
            class="form-control"
            id="maxDepth"
            name="max_depth"
            value="2"
            min="1"
          />
        </div>

        <div class="mb-3">
          <label for="maxPages" class="form-label">Max Pages</label>
          <input
            type="number"
            class="form-control"
            id="maxPages"
            name="max_pages"
            value="100"
            min="1"
          />
        </div>

        <div class="mb-3">
          <label for="timeLimit" class="form-label">Time Limit (seconds)</label>
          <input
            type="number"
            class="form-control"
            id="timeLimit"
            name="time_limit"
            min="1"
            value="300"
          />
        </div>

        <div class="mb-3">
          <label for="domainRestrictions" class="form-label"
            >Domain Restrictions (comma-separated)</label
          >
          <input
            type="text"
            class="form-control"
            id="domainRestrictions"
            name="restrictions"
            placeholder="example.com,another.com"
          />
        </div>

        <div class="mb-3">
          <label for="userAgent" class="form-label">User-Agent</label>
          <input
            type="text"
            class="form-control"
            id="userAgent"
            name="user_agent"
            placeholder="Custom User-Agent"
          />
        </div>

        <div class="mb-4">
          <label for="mode" class="form-label">Crawling Mode *</label>
          <select class="form-select" id="mode" name="mode" required>
            <option value="" disabled selected>Select a crawling mode</option>
            <option value="search" name="search">Search Indexer</option>
            <option value="correlation" name="correlation">
              Correlation Discovery
            </option>
            <option value="sitemap" name="sitemap">Sitemap Generator</option>
          </select>
        </div>

        <!-- Mode-Specific Configuration Fields -->

        <!-- Search Indexer Fields -->
        <div
          class="mb-3 mode-specific"
          id="search-fields"
          style="display: none"
        >
          <div class="card">
            <div class="card-header">
              <h6 class="mb-0">Search Indexer Configuration</h6>
            </div>
            <div class="card-body">
              <div class="mb-3">
                <label for="searchKeyword" class="form-label"
                  >Keyword/Topic</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="searchKeyword"
                  name="search_keyword"
                  placeholder="Enter keyword or topic to search for"
                />
              </div>
              <div class="mb-3">
                <label for="search_fields" class="form-label"
                  >Search Fields</label
                >
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="searchTitle"
                    name="search_fields"
                    value="title"
                  />
                  <label class="form-check-label" for="searchTitle"
                    >Title</label
                  >
                </div>
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="searchBody"
                    name="search_fields"
                    value="body"
                  />
                  <label class="form-check-label" for="searchBody">Body</label>
                </div>
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="searchMetadata"
                    name="search_fields"
                    value="metadata"
                  />
                  <label class="form-check-label" for="searchMetadata"
                    >Metadata</label
                  >
                </div>
              </div>
              <div class="mb-3">
                <label for="matchStrategy" class="form-label"
                  >Match Strategy</label
                >
                <select
                  class="form-select"
                  id="matchStrategy"
                  name="match_strategy"
                >
                  <option value="exact">Exact Match</option>
                  <option value="partial">Partial Match</option>
                  <option value="regex">Regex Match</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="minRelevance" class="form-label"
                  >Minimum Relevance (0-1.0)</label
                >
                <input
                  type="number"
                  class="form-control"
                  id="minRelevance"
                  name="min_relevance"
                  min="0"
                  max="1"
                  step="0.1"
                  value="0.5"
                />
              </div>
            </div>
          </div>
        </div>

        <!-- Correlation Discovery Fields -->
        <div
          class="mb-3 mode-specific"
          id="correlation-fields"
          style="display: none"
        >
          <div class="card">
            <div class="card-header">
              <h6 class="mb-0">Correlation Discovery Configuration</h6>
            </div>
            <div class="card-body">
              <div class="mb-3">
                <label for="targetUrl" class="form-label">Target URL</label>
                <input
                  type="url"
                  class="form-control"
                  id="targetUrl"
                  name="target_url"
                  placeholder="https://example.com"
                />
              </div>
              <div class="mb-3">
                <label for="graphType" class="form-label">Graph Type</label>
                <select class="form-select" id="graphType" name="graph_type">
                  <option value="directed">Directed Graph</option>
                  <option value="undirected">Undirected Graph</option>
                  <option value="weighted">Weighted Graph</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="link_types" class="form-label"
                  >Link Types to Track</label
                >
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="internalLinks"
                    name="link_types"
                    value="internal"
                    checked
                  />
                  <label class="form-check-label" for="internalLinks"
                    >Internal Links</label
                  >
                </div>
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="externalLinks"
                    name="link_types"
                    value="external"
                  />
                  <label class="form-check-label" for="externalLinks"
                    >External Links</label
                  >
                </div>
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="nofollowLinks"
                    name="link_types"
                    value="nofollow"
                  />
                  <label class="form-check-label" for="nofollowLinks"
                    >Nofollow Links</label
                  >
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Sitemap Fields -->
        <div
          class="mb-3 mode-specific"
          id="sitemap-fields"
          style="display: none"
        >
          <div class="card">
            <div class="card-header">
              <h6 class="mb-0">Sitemap Configuration</h6>
            </div>
            <div class="card-body">
              <div class="mb-3">
                <label for="include_assets" class="form-label"
                  >Include Assets</label
                >
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="includeImages"
                    name="include_assets"
                    value="images"
                  />
                  <label class="form-check-label" for="includeImages"
                    >Images</label
                  >
                </div>
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="includeCSS"
                    name="include_assets"
                    value="css"
                  />
                  <label class="form-check-label" for="includeCSS"
                    >CSS Files</label
                  >
                </div>
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="includeJS"
                    name="include_assets"
                    value="js"
                  />
                  <label class="form-check-label" for="includeJS"
                    >JavaScript Files</label
                  >
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label">Crawling Options</label>
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="resolveRedirects"
                    name="resolve_redirects"
                    value="true"
                    checked
                  />
                  <label class="form-check-label" for="resolveRedirects">
                    Resolve Redirects
                  </label>
                </div>
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="includeBrokenLinks"
                    name="include_broken_links"
                    value="true"
                  />
                  <label class="form-check-label" for="includeBrokenLinks">
                    Include Broken Links
                  </label>
                </div>
              </div>
              <div class="mb-3">
                <label for="outputFormat" class="form-label"
                  >Output Format</label
                >
                <select
                  class="form-select"
                  id="outputFormat"
                  name="output_format"
                >
                  <option value="tree">Tree Structure</option>
                  <option value="xml">Sitemap XML</option>
                  <option value="json">JSON</option>
                  <option value="csv">CSV</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary btn-lg">
            🚀 Start Crawl
          </button>
        </div>
      </form>

      <hr class="my-5" />

      <div id="response" class="bg-white p-3 border rounded">
        <h5 class="text-muted">Crawler response will appear here.</h5>
        <!-- Optionally populated by JavaScript later -->
      </div>
    </div>

    <script src="../javascript/index.js"></script>
    <script src="../javascript/crawl.js"></script>
  </body>
</html>
