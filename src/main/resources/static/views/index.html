<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetWeaver – Configuration</title>
    <link rel="icon" href="/images/favicon.ico" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../stylesheets/styles.css" />
  </head>
  <body>
    <!-- Top Corner Buttons -->
    <div class="top-buttons">
      <button
        type="button"
        class="btn btn-theme btn-icon"
        id="themeToggle"
        title="Toggle Theme"
      >
        <i class="bi bi-moon-fill" id="themeIcon"></i>
      </button>
      <button
        type="button"
        class="btn btn-clear btn-icon"
        id="clearForm"
        title="Clear Form"
      >
        <i class="bi bi-trash3-fill"></i>
      </button>
    </div>

    <div class="container mt-5 shadow-lg p-4 rounded">
      <h1 class="mb-4 text-center">NetWeaver - Crawler Configuration</h1>

      <form method="POST" action="/crawl" id="crawlerForm">
        <!-- Shared Configuration Fields -->
        <div class="mb-3">
          <label for="startUrl" class="form-label">Start URL</label>
          <input
            type="url"
            class="form-control"
            id="startUrl"
            name="startUrl"
            placeholder="https://example.com"
            required
          />
        </div>

        <div class="mb-3">
          <label for="depth" class="form-label">Max Depth</label>
          <input
            type="number"
            class="form-control"
            id="depth"
            name="depth"
            value="2"
            min="1"
            required
          />
        </div>

        <div class="mb-3">
          <label for="maxPages" class="form-label">Max Pages</label>
          <input
            type="number"
            class="form-control"
            id="maxPages"
            name="maxPages"
            min="1"
            placeholder="100"
          />
        </div>

        <div class="mb-3">
          <label for="timeLimit" class="form-label">Time Limit (seconds)</label>
          <input
            type="number"
            class="form-control"
            id="timeLimit"
            name="timeLimit"
            min="1"
            placeholder="300"
          />
        </div>

        <div class="mb-3">
          <label for="domainRestrictions" class="form-label"
            >Domain Restrictions (comma-separated)</label
          >
          <input
            type="text"
            class="form-control"
            id="domainRestrictions"
            name="domainRestrictions"
            placeholder="example.com,another.com"
          />
        </div>

        <div class="mb-3">
          <label for="userAgent" class="form-label">User-Agent</label>
          <input
            type="text"
            class="form-control"
            id="userAgent"
            name="userAgent"
            placeholder="Custom User-Agent"
          />
        </div>

        <div class="mb-4">
          <label for="mode" class="form-label">Crawling Mode *</label>
          <select class="form-select" id="mode" name="mode" required>
            <option value="" disabled selected>Select a crawling mode</option>
            <option value="search">Search Indexer</option>
            <option value="correlation">Correlation Discovery</option>
            <option value="sitemap">Domain Map</option>
          </select>
        </div>

        <!-- Mode-Specific Configuration Fields -->

        <!-- Search Indexer Fields -->
        <div
          class="mb-3 mode-specific"
          id="search-fields"
          style="display: none"
        >
          <div class="card">
            <div class="card-header">
              <h6 class="mb-0">Search Indexer Configuration</h6>
            </div>
            <div class="card-body">
              <div class="mb-3">
                <label for="searchKeyword" class="form-label"
                  >Keyword/Topic</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="searchKeyword"
                  name="searchKeyword"
                  placeholder="Enter keyword or topic to search for"
                />
              </div>
              <div class="mb-3">
                <label for="contentType" class="form-label"
                  >Content Type Filter</label
                >
                <select class="form-select" id="contentType" name="contentType">
                  <option value="all">All Content</option>
                  <option value="text">Text Only</option>
                  <option value="images">Images</option>
                  <option value="documents">Documents</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="searchDepth" class="form-label">Search Depth</label>
                <input
                  type="number"
                  class="form-control"
                  id="searchDepth"
                  name="searchDepth"
                  min="1"
                  value="3"
                />
              </div>
            </div>
          </div>
        </div>

        <!-- Correlation Discovery Fields -->
        <div
          class="mb-3 mode-specific"
          id="correlation-fields"
          style="display: none"
        >
          <div class="card">
            <div class="card-header">
              <h6 class="mb-0">Correlation Discovery Configuration</h6>
            </div>
            <div class="card-body">
              <div class="mb-3">
                <label for="graphType" class="form-label">Graph Type</label>
                <select class="form-select" id="graphType" name="graphType">
                  <option value="directed">Directed Graph</option>
                  <option value="undirected">Undirected Graph</option>
                  <option value="weighted">Weighted Graph</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="linkTypes" class="form-label"
                  >Link Types to Track</label
                >
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="internalLinks"
                    name="linkTypes"
                    value="internal"
                    checked
                  />
                  <label class="form-check-label" for="internalLinks"
                    >Internal Links</label
                  >
                </div>
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="externalLinks"
                    name="linkTypes"
                    value="external"
                  />
                  <label class="form-check-label" for="externalLinks"
                    >External Links</label
                  >
                </div>
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="nofollowLinks"
                    name="linkTypes"
                    value="nofollow"
                  />
                  <label class="form-check-label" for="nofollowLinks"
                    >Nofollow Links</label
                  >
                </div>
              </div>
              <div class="mb-3">
                <label for="correlationThreshold" class="form-label"
                  >Correlation Threshold</label
                >
                <input
                  type="number"
                  class="form-control"
                  id="correlationThreshold"
                  name="correlationThreshold"
                  min="0"
                  max="1"
                  step="0.1"
                  value="0.5"
                />
              </div>
            </div>
          </div>
        </div>

        <!-- Domain Map Fields -->
        <div
          class="mb-3 mode-specific"
          id="sitemap-fields"
          style="display: none"
        >
          <div class="card">
            <div class="card-header">
              <h6 class="mb-0">Domain Map Configuration</h6>
            </div>
            <div class="card-body">
              <div class="mb-3">
                <label for="mapDepth" class="form-label">Map Depth</label>
                <input
                  type="number"
                  class="form-control"
                  id="mapDepth"
                  name="mapDepth"
                  min="1"
                  value="3"
                />
              </div>
              <div class="mb-3">
                <label for="includeAssets" class="form-label"
                  >Include Assets</label
                >
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="includeImages"
                    name="includeAssets"
                    value="images"
                  />
                  <label class="form-check-label" for="includeImages"
                    >Images</label
                  >
                </div>
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="includeCSS"
                    name="includeAssets"
                    value="css"
                  />
                  <label class="form-check-label" for="includeCSS"
                    >CSS Files</label
                  >
                </div>
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="includeJS"
                    name="includeAssets"
                    value="js"
                  />
                  <label class="form-check-label" for="includeJS"
                    >JavaScript Files</label
                  >
                </div>
              </div>
              <div class="mb-3">
                <label for="outputFormat" class="form-label"
                  >Output Format</label
                >
                <select
                  class="form-select"
                  id="outputFormat"
                  name="outputFormat"
                >
                  <option value="tree">Tree Structure</option>
                  <option value="sitemap">Sitemap XML</option>
                  <option value="json">JSON</option>
                  <option value="csv">CSV</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary btn-lg">
            🚀 Start Crawl
          </button>
        </div>
      </form>

      <hr class="my-5" />

      <div id="response" class="bg-white p-3 border rounded">
        <h5 class="text-muted">Crawler response will appear here.</h5>
        <!-- Optionally populated by JavaScript later -->
      </div>
    </div>

    <script src="../javascript/index.js"></script>
    <script src="../javascript/crawl.js"></script>
  </body>
</html>
